<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bunker da Aprovação</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root{--vd:#1a2e1a;--vm:#2d5a1e;--vc:#4a8c2a;--vb:#5db832;--ou:#c9a227;--ol:#e8c547;--br:#f0f0e8;--ci:#888f82;--pt:#0a0f0a;--card:#111a11;--border:rgba(255,255,255,0.07);}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:#0d120d;font-family:'Barlow',sans-serif;color:var(--br);overflow-x:hidden;}

/* ══ LOADING ESTÉTICO ══ */
.loading-overlay{
  position:fixed;inset:0;z-index:9999;
  background:radial-gradient(ellipse at center, #0d1f0d 0%, #050a05 100%);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:24px;
  transition:opacity .8s ease;
}
.loading-overlay.hide{opacity:0;pointer-events:none;}
.loading-logo-wrap{position:relative;display:flex;align-items:center;justify-content:center;}
.loading-logo-img{
  width:140px;height:140px;object-fit:contain;
  animation:logoPulse 2.5s ease infinite;
  filter:drop-shadow(0 0 20px rgba(93,184,50,0.5));
}
.loading-ring{
  position:absolute;
  width:180px;height:180px;
  border-radius:50%;
  border:1px solid rgba(93,184,50,0.2);
  animation:ringPulse 2.5s ease infinite;
}
.loading-ring2{
  position:absolute;
  width:210px;height:210px;
  border-radius:50%;
  border:1px solid rgba(201,162,39,0.1);
  animation:ringPulse 2.5s ease infinite .4s;
}
@keyframes logoPulse{0%,100%{filter:drop-shadow(0 0 15px rgba(93,184,50,0.5));transform:scale(1);}50%{filter:drop-shadow(0 0 35px rgba(93,184,50,0.8));transform:scale(1.04);}}
@keyframes ringPulse{0%,100%{transform:scale(1);opacity:.5;}50%{transform:scale(1.08);opacity:1;}}
.loading-text{font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:8px;color:rgba(240,240,232,0.35);text-align:center;}
.loading-bar{width:140px;height:2px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;}
.loading-bar-fill{height:100%;background:linear-gradient(90deg,var(--vm),var(--vb),var(--ol));border-radius:2px;animation:loadFill 2.5s ease forwards;}
@keyframes loadFill{0%{width:0%}60%{width:80%}100%{width:100%}}
.loading-stars{display:flex;gap:6px;justify-content:center;}
.loading-star{font-size:10px;color:var(--ou);opacity:0;animation:starFade 2.5s ease forwards;}
.loading-star:nth-child(1){animation-delay:.2s;}
.loading-star:nth-child(2){animation-delay:.5s;}
.loading-star:nth-child(3){animation-delay:.8s;}
@keyframes starFade{0%{opacity:0;transform:scale(0)}60%{opacity:1;transform:scale(1.2)}100%{opacity:1;transform:scale(1)}}

/* ══ TOPBAR ══ */
.topbar{position:fixed;top:0;left:0;right:0;z-index:900;background:rgba(8,13,8,0.97);border-bottom:1px solid rgba(93,184,50,0.12);backdrop-filter:blur(16px);display:flex;align-items:center;height:58px;}
.topbar-logo{display:flex;align-items:center;gap:10px;padding:0 20px;border-right:1px solid var(--border);height:100%;}
.topbar-logo img{width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 0 6px rgba(93,184,50,0.4));}
.topbar-logo-text{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;color:var(--br);line-height:1;}
.topbar-logo-text span{color:var(--vb);}
.topbar-logo-sub{font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:3px;color:var(--ou);text-transform:uppercase;}
.topbar-nav{display:flex;align-items:center;gap:2px;padding:0 12px;flex:1;overflow-x:auto;}
.topbar-nav::-webkit-scrollbar{display:none;}
.tnav-btn{background:none;border:none;cursor:pointer;padding:8px 12px;border-radius:5px;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;letter-spacing:1px;color:rgba(240,240,232,0.5);transition:all .2s;white-space:nowrap;}
.tnav-btn:hover{background:rgba(93,184,50,0.08);color:var(--vb);}
.topbar-actions{display:flex;align-items:center;gap:6px;padding:0 12px;margin-left:auto;}
.btn-admin{background:rgba(201,162,39,0.08);border:1px solid rgba(201,162,39,0.2);border-radius:5px;padding:6px 12px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1px;color:var(--ou);transition:all .2s;white-space:nowrap;}
.btn-admin:hover{background:rgba(201,162,39,0.15);}
.btn-wpp-top{background:#25D366;border:none;border-radius:5px;padding:6px 12px;font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1px;color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;transition:all .2s;}
.btn-wpp-top:hover{background:#1da851;}

/* ══ HERO ══ */
.hero{padding:90px 20px 60px;background:linear-gradient(180deg,#080f08 0%,#0d120d 100%);position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;top:-150px;left:50%;transform:translateX(-50%);width:700px;height:700px;background:radial-gradient(circle,rgba(93,184,50,0.06) 0%,transparent 65%);pointer-events:none;}
.hero-inner{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 380px;gap:48px;align-items:center;}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(93,184,50,0.06);border:1px solid rgba(93,184,50,0.2);border-radius:100px;padding:5px 14px;margin-bottom:16px;}
.hero-badge .dot{width:5px;height:5px;border-radius:50%;background:var(--vb);box-shadow:0 0 8px var(--vb);animation:pulse 2s infinite;}
.hero-badge span{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--vb);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.hero-logo-area{display:flex;align-items:center;gap:16px;margin-bottom:16px;}
.hero-logo-img{width:72px;height:72px;object-fit:contain;filter:drop-shadow(0 0 12px rgba(93,184,50,0.4));}
.hero-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(38px,5.5vw,66px);letter-spacing:2px;line-height:.92;}
.hero-title span{color:var(--vb);}
.hero-sub{font-size:14px;line-height:1.75;color:rgba(240,240,232,0.55);max-width:440px;margin-bottom:24px;}
.hero-stats{display:flex;gap:24px;margin-bottom:28px;}
.hstat{text-align:center;}
.hstat-n{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--vb);line-height:1;}
.hstat-l{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:2px;color:var(--ci);margin-top:2px;}
.hstat-div{width:1px;background:rgba(255,255,255,0.07);}
.hero-btns{display:flex;gap:10px;flex-wrap:wrap;}
.btn-primary{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--vc),var(--vm));border:1.5px solid var(--vb);border-radius:6px;padding:12px 24px;font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:2px;color:var(--br);text-decoration:none;cursor:pointer;box-shadow:0 0 20px rgba(93,184,50,0.15);transition:all .25s;}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 28px rgba(93,184,50,0.3);}
.btn-secondary{display:inline-flex;align-items:center;gap:8px;background:#25D366;border:none;border-radius:6px;padding:12px 20px;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;letter-spacing:1px;color:#fff;text-decoration:none;cursor:pointer;transition:all .25s;}
.btn-secondary:hover{background:#1da851;}
.hero-card{background:linear-gradient(135deg,rgba(20,40,20,0.9),rgba(8,13,8,0.97));border:1px solid rgba(93,184,50,0.15);border-radius:12px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,0.6);}
.hero-card-top{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,0.05);}
.hero-card-logo{width:36px;height:36px;object-fit:contain;filter:drop-shadow(0 0 6px rgba(93,184,50,0.3));}
.hero-card-title{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;color:var(--ou);}
.hc-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.04);}
.hc-item:last-child{border-bottom:none;}
.hc-icon{font-size:15px;width:22px;text-align:center;}
.hc-text{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;color:rgba(240,240,232,0.75);}
.hc-badge{margin-left:auto;background:rgba(93,184,50,0.1);border:1px solid rgba(93,184,50,0.22);border-radius:4px;padding:2px 7px;font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:1px;color:var(--vb);}
.hc-badge.new{background:rgba(201,162,39,0.1);border-color:rgba(201,162,39,0.25);color:var(--ol);}

/* ══ MAIN ══ */
.main{max-width:1100px;margin:0 auto;padding:40px 20px 70px;}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.sec-title{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px;color:var(--br);}
.sec-title span{color:var(--vb);}
.sec-count{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:2px;color:var(--ci);}
.filtros{display:flex;gap:6px;margin-bottom:22px;overflow-x:auto;padding-bottom:4px;}
.filtros::-webkit-scrollbar{display:none;}
.filtro-btn{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:100px;padding:5px 14px;cursor:pointer;white-space:nowrap;font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1px;color:rgba(240,240,232,0.45);transition:all .2s;}
.filtro-btn:hover,.filtro-btn.active{background:rgba(93,184,50,0.08);border-color:rgba(93,184,50,0.25);color:var(--vb);}
.cursos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.curso-card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:all .25s;display:flex;flex-direction:column;}
.curso-card:hover{border-color:rgba(93,184,50,0.25);transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,0.5);}
.curso-thumb{height:110px;display:flex;align-items:center;justify-content:center;font-size:44px;position:relative;overflow:hidden;}
.curso-thumb-overlay{position:absolute;inset:0;opacity:0.12;}
.curso-badges{position:absolute;top:8px;left:8px;display:flex;gap:4px;}
.cbadge{border-radius:4px;padding:2px 7px;font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:1px;font-weight:700;}
.cbadge.novo{background:var(--ou);color:#000;}
.cbadge.gratis{background:var(--vb);color:#000;}
.cbadge.destaque{background:rgba(93,184,50,0.18);border:1px solid var(--vb);color:var(--vb);}
.curso-body{padding:16px;flex:1;display:flex;flex-direction:column;}
.curso-cat{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--ou);margin-bottom:4px;}
.curso-nome{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px;color:var(--br);margin-bottom:5px;line-height:1.1;}
.curso-desc{font-size:12px;line-height:1.6;color:rgba(240,240,232,0.45);flex:1;margin-bottom:12px;}
.curso-meta{margin-bottom:12px;}
.curso-meta-item{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:1px;color:rgba(240,240,232,0.3);}
.curso-footer{display:flex;align-items:center;justify-content:space-between;}
.curso-preco{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--vb);}
.curso-preco-de{font-family:'Barlow Condensed',sans-serif;font-size:10px;color:rgba(240,240,232,0.25);text-decoration:line-through;}
.btn-comprar{background:linear-gradient(135deg,var(--vc),var(--vm));border:1px solid var(--vb);border-radius:5px;padding:7px 14px;cursor:pointer;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:2px;color:var(--br);text-decoration:none;display:inline-block;transition:all .2s;}
.btn-comprar:hover{box-shadow:0 4px 16px rgba(93,184,50,0.25);}

/* ══ SOBRE ══ */
.sobre-section{background:linear-gradient(135deg,rgba(20,40,20,0.35),rgba(8,13,8,0.7));border:1px solid rgba(93,184,50,0.1);border-radius:12px;padding:36px;margin-top:40px;display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center;}
.sobre-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;margin-bottom:10px;}
.sobre-title span{color:var(--vb);}
.sobre-text{font-size:14px;line-height:1.8;color:rgba(240,240,232,0.55);}
.sobre-itens{display:flex;flex-direction:column;gap:10px;}
.sobre-item{display:flex;align-items:center;gap:10px;padding:10px;background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.05);border-radius:8px;}
.sobre-item-icon{font-size:20px;width:30px;text-align:center;}
.sobre-item-text{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;color:rgba(240,240,232,0.75);}
.sobre-item-sub{font-size:11px;color:rgba(240,240,232,0.3);}

/* ══ FOOTER ══ */
footer{background:rgba(0,0,0,0.5);border-top:1px solid rgba(255,255,255,0.05);padding:32px 20px;text-align:center;}
.footer-logo-wrap{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px;}
.footer-logo-img{width:32px;height:32px;object-fit:contain;opacity:0.5;filter:grayscale(30%);}
.footer-logo{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:4px;color:rgba(240,240,232,0.25);}
.footer-logo span{color:rgba(93,184,50,0.35);}
.footer-sub{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:2px;color:rgba(240,240,232,0.18);margin-top:4px;}

/* ══ MODAL ══ */
.modal-bg{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.88);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:16px;}
.modal-bg.open{display:flex;}
.modal{background:linear-gradient(135deg,#0d1f0d,#080f08);border:1px solid rgba(201,162,39,0.25);border-radius:12px;padding:28px;width:100%;max-width:360px;box-shadow:0 30px 80px rgba(0,0,0,0.8);}
.modal-logo{display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
.modal-logo img{width:48px;height:48px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(93,184,50,0.4));}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;color:var(--ou);text-align:center;margin-bottom:4px;}
.modal-sub{font-size:12px;color:rgba(240,240,232,0.35);text-align:center;margin-bottom:20px;}
.modal-input{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:6px;padding:11px 13px;font-family:'Barlow',sans-serif;font-size:14px;color:var(--br);margin-bottom:10px;}
.modal-input:focus{outline:none;border-color:rgba(93,184,50,0.35);}
.modal-btns{display:flex;gap:8px;}
.modal-ok{flex:1;background:linear-gradient(135deg,var(--vc),var(--vm));border:1px solid var(--vb);border-radius:6px;padding:10px;cursor:pointer;font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:2px;color:var(--br);}
.modal-cancel{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:6px;padding:10px 14px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:12px;color:rgba(240,240,232,0.4);}
.modal-err{font-size:12px;color:#f87171;text-align:center;margin-bottom:8px;display:none;}

/* ══ ADMIN ══ */
#admin-panel{position:fixed;inset:0;z-index:8888;background:#060d06;overflow-y:auto;display:none;}
#admin-panel.open{display:block;}
.admin-topbar{background:#0a170a;border-bottom:2px solid var(--ou);padding:10px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:10;}
.admin-logo-wrap{display:flex;align-items:center;gap:8px;}
.admin-logo-img{width:28px;height:28px;object-fit:contain;filter:drop-shadow(0 0 5px rgba(93,184,50,0.4));}
.admin-logo{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:3px;color:var(--vb);}
.admin-logo span{color:var(--ou);}
.adm-btn{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:5px;padding:6px 13px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1px;color:rgba(240,240,232,0.65);transition:all .2s;}
.adm-btn:hover{background:rgba(93,184,50,0.12);border-color:rgba(93,184,50,0.25);color:var(--vb);}
.adm-btn.save{background:linear-gradient(135deg,var(--vc),var(--vm));border-color:var(--vb);color:var(--br);}
.adm-btn.danger{border-color:rgba(220,50,50,0.25);color:#f87171;}
.adm-status{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:1px;color:rgba(240,240,232,0.25);margin-left:auto;}
.admin-body{max-width:840px;margin:0 auto;padding:28px 20px 70px;}
.adm-section{margin-bottom:30px;}
.adm-section-title{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:3px;color:var(--ou);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,0.06);}
.adm-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.adm-field{margin-bottom:11px;}
.adm-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(240,240,232,0.35);display:block;margin-bottom:4px;}
.adm-input,.adm-textarea,.adm-select{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:5px;padding:7px 9px;font-family:'Barlow',sans-serif;font-size:13px;color:var(--br);resize:vertical;}
.adm-input:focus,.adm-textarea:focus,.adm-select:focus{outline:none;border-color:rgba(93,184,50,0.35);}
.adm-select option{background:#0a170a;}
.adm-textarea{min-height:65px;line-height:1.6;}
.adm-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.adm-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;}
.curso-ed-list{display:flex;flex-direction:column;gap:10px;}
.curso-ed-card{background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.07);border-radius:8px;padding:13px;}
.curso-ed-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.curso-ed-nome{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--ol);flex:1;}
.curso-ed-btns{display:flex;gap:5px;}
.ced-btn{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:4px;padding:3px 9px;cursor:pointer;font-size:11px;color:rgba(240,240,232,0.45);transition:all .2s;}
.ced-btn:hover{background:rgba(93,184,50,0.08);color:var(--vb);}
.ced-btn.del{color:#f87171;}
.curso-ed-body{display:none;}
.curso-ed-body.open{display:block;}
.add-curso-btn{width:100%;background:rgba(93,184,50,0.05);border:1px dashed rgba(93,184,50,0.2);border-radius:6px;padding:9px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1px;color:rgba(93,184,50,0.5);transition:all .2s;margin-top:7px;}
.add-curso-btn:hover{background:rgba(93,184,50,0.1);color:var(--vb);}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(20,40,20,0.97);border:1px solid var(--vb);border-radius:6px;padding:9px 18px;font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:1px;color:var(--vb);z-index:99999;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap;}
.toast.show{opacity:1;}
@media(max-width:650px){.hero-inner{grid-template-columns:1fr;}.hero-card{display:none;}.sobre-section{grid-template-columns:1fr;}.adm-row,.adm-row3,.adm-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>

<!-- LOADING -->
<div class="loading-overlay" id="loading">
